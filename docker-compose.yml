# Local development stack for ReviewFlow.
#
# Each service is the local stand-in for a production one, chosen so the
# application code is identical in both places:
#
#   postgres -> Neon              (same Postgres wire protocol)
#   minio    -> Cloudflare R2     (same S3 API, so one storage client serves both)
#   mailpit  -> Resend            (catches all outbound mail; nothing escapes to real inboxes)
#
# Start with:  pnpm docker:up
#
# Images are pinned. Reproducible setup matters more here than being current,
# and an unpinned `latest` on a dev dependency is a silent breakage waiting to
# happen.

services:
  postgres:
    image: postgres:17-alpine
    container_name: reviewflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewflow
      POSTGRES_PASSWORD: reviewflow
      POSTGRES_DB: reviewflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewflow -d reviewflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage.
  #
  # Why the bitnamilegacy image: MinIO withdrew its own community images —
  # docker.io/minio/minio now 404s and quay.io/minio/minio requires auth — so
  # this archived-but-public build is the last freely pullable MinIO. It is
  # frozen, which for a local-only dev dependency is a feature, not a risk.
  #
  # If this repository ever disappears, storage sits behind the StorageProvider
  # interface in lib/storage, so switching to localstack/localstack (also S3,
  # actively maintained) is a change to this file plus two env vars.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: reviewflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: reviewflow
      MINIO_ROOT_PASSWORD: reviewflow-secret
      # Created on first boot, so no separate `mc` init container is needed.
      MINIO_DEFAULT_BUCKETS: reviewflow-documents
      MINIO_SCHEME: http
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: reviewflow-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + REST API
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
