# Local development stack for ReviewFlow.
#
# Each service is the local stand-in for a production one, chosen so the
# application code is identical in both places:
#
#   postgres -> Neon              (same Postgres wire protocol)
#   minio    -> Cloudflare R2     (same S3 API, so one storage client serves both)
#   mailpit  -> Resend            (catches all outbound mail; nothing escapes to real inboxes)
#
# Start with:  pnpm docker:up

services:
  postgres:
    image: postgres:17-alpine
    container_name: reviewflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewflow
      POSTGRES_PASSWORD: reviewflow
      POSTGRES_DB: reviewflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewflow -d reviewflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: reviewflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reviewflow
      MINIO_ROOT_PASSWORD: reviewflow-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private bucket, then exits. `docker compose ps` showing
  # this as "exited (0)" is the expected healthy state, not a failure.
  minio-init:
    image: minio/mc:latest
    container_name: reviewflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reviewflow reviewflow-secret &&
      mc mb --ignore-existing local/reviewflow-documents &&
      mc anonymous set none local/reviewflow-documents &&
      echo 'Bucket reviewflow-documents ready (private).'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: reviewflow-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + REST API

volumes:
  postgres-data:
  minio-data:
